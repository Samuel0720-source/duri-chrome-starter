<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>둘이 · 기념일</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <main>
    <header><img src="icons/48.png" width="30" height="30" alt=""><span>둘이</span></header>
    <h1>우리 기념일</h1>
    <div class="result" role="status">
      <strong id="count">첫날을 골라 주세요</strong>
      <span id="next-day"></span>
    </div>
    <fieldset id="controls" disabled>
      <label for="start">함께한 첫날</label>
      <input type="date" id="start" min="1900-01-01" max="9998-12-31">
      <label for="zone">기준 시간대</label>
      <select id="zone"></select>
      <label class="remember"><input type="checkbox" id="remember"> 이 기기에 날짜와 시간대 기억</label>
      <button type="button" id="mini">작은 창으로 열기</button>
      <button type="button" id="full">전체 웹앱 열기 ↗</button>
    </fieldset>
    <p role="alert" id="error" hidden></p>
  </main>
</body>
</html>
