<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="title">둘이 · 기념일</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <main>
    <header>
      <img src="icons/postbirds.webp" width="54" height="36" alt="">
      <span data-i18n="brand">둘이</span>
      <button type="button" id="full" class="open-full" data-i18n="full">전체 웹앱 ↗</button>
    </header>

    <div class="mode-tabs" role="tablist" aria-label="둘이 메뉴" data-i18n-label="modesLabel">
      <button type="button" id="tab-days" role="tab" aria-selected="true" aria-controls="panel-days" data-i18n="tabDays">기념일</button>
      <button type="button" id="tab-draw" role="tab" aria-selected="false" aria-controls="panel-draw" data-i18n="tabDraw">함께 그리기</button>
    </div>

    <div id="panel-days" role="tabpanel" aria-labelledby="tab-days">
      <section class="sheet" role="status" aria-label="기념일 계산 결과" data-i18n-label="result">
        <div class="dateline"><span data-i18n="today">오늘</span><time id="today"></time></div>
        <p class="caption" id="caption">첫날을 골라 주세요</p>
        <div class="big" id="big" hidden><strong id="count"></strong><span id="unit">일째</span></div>
        <dl id="rows" hidden>
          <div><dt id="hundred-label"></dt><dd><span id="hundred-left"></span><small id="hundred-date"></small></dd></div>
          <div><dt data-i18n="annual">연애 기념일</dt><dd><span id="annual-left"></span><small id="annual-date"></small></dd></div>
        </dl>
      </section>
      <details id="settings">
        <summary data-i18n="settings">날짜 설정</summary>
        <fieldset id="controls" disabled>
          <label for="start" data-i18n="start">함께한 첫날</label>
          <input type="date" id="start" min="1900-01-01" max="9998-12-31">
          <label for="zone" data-i18n="zone">기준 시간대</label>
          <select id="zone"></select>
          <label class="remember"><input type="checkbox" id="remember"> <span data-i18n="remember">이 기기에 날짜와 시간대 기억</span></label>
        </fieldset>
      </details>
    </div>

    <div id="panel-draw" role="tabpanel" aria-labelledby="tab-draw" hidden>
      <section class="sheet sketch-sheet">
        <div class="sketch-top">
          <span class="sync-pill" id="sync-pill" data-live="off">● 오프라인 낙서</span>
          <button type="button" id="open-studio" class="mini-link" data-i18n="openStudio">큰 화면 ↗</button>
        </div>

        <div class="canvas-frame" id="canvas-frame">
          <canvas id="sketch-canvas" data-testid="ext-sketch-canvas" width="1000" height="750" role="img" aria-label="함께 그리기 캔버스" data-i18n-label="canvasLabel"></canvas>
        </div>

        <div class="sketch-row">
          <div class="seg" role="radiogroup" aria-label="도구" data-i18n-label="toolLabel">
            <button type="button" class="tool-btn" data-tool="pen" aria-checked="true" data-i18n="toolPen">펜</button>
            <button type="button" class="tool-btn" data-tool="erase" aria-checked="false" data-i18n="toolErase">지우개</button>
            <button type="button" class="tool-btn" data-tool="stamp" aria-checked="false" data-i18n="toolStamp">스티커</button>
          </div>
          <div class="seg" id="size-group" role="radiogroup" aria-label="굵기" data-i18n-label="sizeLabel">
            <button type="button" class="size-btn" data-size="4" aria-checked="false">S</button>
            <button type="button" class="size-btn" data-size="9" aria-checked="true">M</button>
            <button type="button" class="size-btn" data-size="16" aria-checked="false">L</button>
          </div>
        </div>

        <div class="swatches" id="ext-swatches" role="radiogroup" aria-label="색상" data-i18n-label="colorLabel"></div>
        <div class="stamps" id="ext-stamps" role="radiogroup" aria-label="스티커" data-i18n-label="stampLabel" hidden></div>

        <div class="sketch-actions">
          <div class="bg-dots" id="ext-bgs" role="radiogroup" aria-label="배경색" data-i18n-label="bgLabel"></div>
          <div class="action-btns">
            <button type="button" id="ext-undo" class="pill-btn" data-i18n="undo">되돌리기</button>
            <button type="button" id="ext-clear" class="pill-btn" data-i18n="clear">지우기</button>
          </div>
        </div>

        <div class="pair-box" id="pair-box">
          <div id="unpaired-view">
            <p class="pair-hint" data-i18n="pairHint">둘이 방과 연결하면 상대와 실시간으로 같이 그려요.</p>
            <div class="pair-btns">
              <button type="button" id="connect-room" class="pill-btn accent" data-i18n="connectRoom">방 연결하기 ↗</button>
            </div>
            <details class="manual-pair" id="manual-pair">
              <summary data-i18n="pasteCode">연결 코드 직접 입력</summary>
              <form id="pair-form" class="pair-form">
                <input type="text" id="pair-input" placeholder="64자리 코드" data-i18n-placeholder="codePlaceholder" autocomplete="off" spellcheck="false">
                <button type="submit" class="pill-btn accent" data-i18n="saveCode">연결</button>
              </form>
            </details>
          </div>
          <div id="paired-view" hidden>
            <button type="button" id="disconnect-room" class="mini-link" data-i18n="disconnect">연결 해제</button>
          </div>
        </div>
      </section>
    </div>

    <p role="alert" id="error" hidden></p>
  </main>
</body>
</html>
