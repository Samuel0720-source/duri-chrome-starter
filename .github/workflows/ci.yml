# Runs on GitHub's servers.
# 1. Every push and pull request: unit tests, database tests, typecheck.
# 2. After Vercel reports a successful production deploy: the two-person flow test on the live site.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  deployment_status:

jobs:
  checks:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:db
      - run: npx tsc --noEmit -p .

  live-flow:
    # Vercel sends deployment_status events once the project is connected to this repository.
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLOW_URL: https://duri-chrome-starter.vercel.app
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Skips itself (and says so) until the repository secret SUPABASE_SECRET_KEY exists.
      - run: npm run test:flow
